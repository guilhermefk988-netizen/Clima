<!doctype html>

              <span

                  width="25"
                  height="30"
                  src="https://img.icons8.com/fluency-systems-filled/48/0084ff/thick-arrow-pointing-down.png"

                />16°C</span

          </div>

          <div class="Sol__imagem">
            <img src="img/imagemSol.png" alt="" />
